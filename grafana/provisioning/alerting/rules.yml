# Generado por scripts/generar_alertas.py — editar la tabla de reglas allí y regenerar.
apiVersion: 1
groups:
- orgId: 1
  name: nextguard
  folder: NextGuard
  interval: 1m
  rules:
  - uid: ng-temp-alta
    title: Temperatura alta
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 86400
        to: 0
      datasourceUid: influxdb
      model:
        refId: A
        datasource:
          type: influxdb
          uid: influxdb
        query: "from(bucket: \"sensores\")\n  |> range(start: -3m)\n  |> filter(fn: (r) => r._measurement == \"temperatura\" and r._field == \"valor\" and not (exists r.ubicacion and r.ubicacion == \"Simulador\"\
          ))\n  |> group(columns: [\"cliente\", \"sensor\"])\n  |> aggregateWindow(every: 1m, fn: mean, createEmpty: false)"
        intervalMs: 1000
        maxDataPoints: 43200
    - refId: B
      datasourceUid: __expr__
      model:
        refId: B
        datasource:
          type: __expr__
          uid: __expr__
        type: reduce
        expression: A
        reducer: last
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        refId: C
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: B
        conditions:
        - evaluator:
            type: gt
            params:
            - 35
    noDataState: OK
    execErrorState: Error
    for: 5m
    labels:
      severidad: warning
      proyecto: nextguard
    annotations:
      summary: 'Temperatura > 35 °C en {{ $labels.sensor }} ({{ $labels.cliente }}): {{ $values.B }} °C'
