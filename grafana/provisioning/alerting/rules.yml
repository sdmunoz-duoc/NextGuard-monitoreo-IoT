          uid: __expr__
        type: reduce
        expression: B
        reducer: last
        settings:
          mode: dropNN
    - refId: E
      datasourceUid: __expr__
      model:
        refId: E
        datasource:
          type: __expr__
          uid: __expr__
        type: math
        expression: $C > 300 && $D < 120
    - refId: F
      datasourceUid: __expr__
      model:
        refId: F
        datasource:
          type: __expr__
          uid: __expr__
        type: threshold
        expression: E
        conditions:
        - evaluator:
