apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: duoc
      defaultBucket: sensores
    secureJsonData:
      token: $__file{/run/tokens/token}     # token de SOLO lectura creado por db/influx-init.sh
