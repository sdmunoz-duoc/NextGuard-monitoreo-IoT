name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            api/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: python scripts/casos_de_prueba.py
      - run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar docker-compose
        run: docker compose --env-file deploy/.env.example -f deploy/docker-compose.yml config -q
      - name: Construir la imagen de la API
        run: docker build -t nextguard-api api
      - name: Validar JSON del dashboard de Grafana
        run: python3 -m json.tool deploy/grafana/dashboards/nextguard.json > /dev/null

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
