# NextGuard: stack completo en una sola EC2 (un contenedor por servicio).
# Uso:  cp .env.example .env && editar claves && docker compose up -d --build
name: nextguard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sensores_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definir en .env}
      POSTGRES_DB: sensores
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?definir en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/02-roles.sh:/docker-entrypoint-initdb.d/02-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sensores_app -d sensores"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 1g
    networks: [backend]          # sin puertos publicados: solo accesible desde la red interna

  api:
    build: ../api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://sensores_app:${POSTGRES_PASSWORD}@db:5432/sensores
      API_KEYS: ${API_KEYS:?definir en .env}
      AUTO_CREATE_TABLES: "false"      # el esquema lo crea db/schema.sql
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    mem_limit: 512m
    networks: [backend]

  grafana:
    image: grafana/grafana-oss:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?definir en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    mem_limit: 512m
    networks: [backend]

volumes:
  pgdata:
  grafana-data:

networks:
  backend:
